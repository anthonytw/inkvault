name: CI

# When CI runs (docs/HANDOFF.md "CI"):
# - Draft PRs run nothing. Open work as a draft; `gh pr ready` (or "Ready for
#   review") starts CI, and later pushes to a ready PR run it again.
# - Any branch can be checked on demand: `gh workflow run CI --ref <branch>`;
#   `-f screenshots=true` runs only the App Store screenshots job instead.
# - A newer push to the same PR cancels the older run.
# - Only the jobs a change can affect run (the `changes` job); main runs all.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      screenshots:
        description: "Only build the App Store screenshots (docs/appstore/screenshots.md) and upload them"
        type: boolean
        default: false

concurrency:
  # A screenshots run gets its own group: it must not queue (or be replaced) behind main's CI.
  group: ci-${{ github.event.pull_request.number || github.ref }}${{ inputs.screenshots && '-screenshots' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Decide which jobs to run
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !inputs.screenshots
    runs-on: ubuntu-24.04
    outputs:
      package: ${{ steps.f.outputs.package }}
      app: ${{ steps.f.outputs.app }}
      web: ${{ steps.f.outputs.web }}
      webgolden: ${{ steps.f.outputs.webgolden }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        name: Classify changed paths
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo "package=true" >> "$GITHUB_OUTPUT"; echo "app=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"; echo "webgolden=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")"
          echo "$files"
          has() { printf '%s\n' "$files" | grep -Eq "$1" && echo true || echo false; }
          # Swift package: Linux + macOS build and test.
          # scripts/screenshots.sh only drives the manual screenshots job.
          pkgfiles="$(printf '%s\n' "$files" | grep -v '^scripts/screenshots\.sh$' || true)"
          package=$(printf '%s\n' "$pkgfiles" | grep -Eq '^(Sources/|Tests/|Package\.(swift|resolved)$|scripts/|\.github/workflows/ci\.yml$)' && echo true || echo false)
          # The app links Age, Sempere and SempereRender (and CZlib under them), and its
          # tests open the package's fixture vault; CLI, importer and WebDAV changes
          # cannot affect it.
          app=$(has '^(Apps/|Sources/(Age|Sempere|SempereRender|CZlib)/|Tests/SempereTests/Fixtures/|Package\.(swift|resolved)$|scripts/app\.sh$|\.github/workflows/ci\.yml$)')
          # Web viewer (web/): its own job; app changes do not run it.
          web=$(has '^(web/|\.github/workflows/ci\.yml$)')
          # The goldens are the CLI's JSON and SVG export of the fixture vaults: a
          # change to the reducer, the renderer, the CLI or the fixtures can move them,
          # and the PR that moves them must update web/ too (not find out on main).
          webgolden=$(has '^(web/|Sources/(Age|Sempere|SempereRender|SempereCLI|CZlib)/|Tests/SempereTests/Fixtures/|Package\.(swift|resolved)$|\.github/workflows/ci\.yml$)')
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "webgolden=$webgolden" >> "$GITHUB_OUTPUT"
          echo "package=$package app=$app web=$web webgolden=$webgolden"

  linux:
    name: Linux (swift:6.4-noble)
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-24.04
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install zlib headers, zbar, poppler (QR decode, text extraction, PDF background pixel checks) and the UCD (BidiTest.txt)
        run: |
          apt-get update -q
          apt-get install -y -q zlib1g-dev curl zbar-tools poppler-utils unicode-data
      - name: Install age v1.3.2 (post-quantum interop; Ubuntu's package is 1.1)
        run: |
          curl -fsSL -o /tmp/age.tgz https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          echo "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  /tmp/age.tgz" | sha256sum -c -
          tar xzf /tmp/age.tgz -C /usr/local/bin --strip-components=1 age/age age/age-keygen
          age --version
      # Build cache: main saves it, PRs only restore (docs/HANDOFF.md "CI").
      - id: cachekey
        name: Cache key (toolchain + resolved packages)
        run: echo "key=linux-$(echo "$GITHUB_WORKSPACE" | cksum | cut -d" " -f1)-$(swift --version 2>&1 | head -1 | cksum | cut -d' ' -f1)-${{ hashFiles('Package.resolved') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: .build
          key: ${{ steps.cachekey.outputs.key }}-${{ github.sha }}
          restore-keys: ${{ steps.cachekey.outputs.key }}-
      - name: Build
        run: swift build --build-tests
      - name: Test
        env:
          SEMPERE_REQUIRE_AGE_PQ: "1"
          # PDF background pixel checks against pdftoppm (poppler-utils, installed above).
          SEMPERE_REQUIRE_POPPLER: "1"
        run: swift test --skip-build --parallel
      - uses: actions/cache/save@v4
        if: success() && github.ref == 'refs/heads/main'
        with:
          path: .build
          key: ${{ steps.cachekey.outputs.key }}-${{ github.sha }}
      - name: Portability guard
        run: scripts/check-portability.sh
      # The static release build only matters for what ships: main and releases.
      - name: Release build of the CLI (static stdlib)
        if: github.event_name != 'pull_request'
        # Swift 6.4's default build system does not link Foundation's own static
        # dependencies under --static-swift-stdlib; name them explicitly (CLAUDE.md).
        run: >-
          swift build -c release --product sempere --static-swift-stdlib
          -Xlinker -lCoreFoundation -Xlinker -l_FoundationICU
          -Xlinker -l_FoundationCollections -Xlinker -l_FoundationCShims
          -Xlinker -lswiftSynchronization -Xlinker -l_CFXMLInterface
          -Xlinker -l_CFURLSessionInterface -Xlinker -lcurl -Xlinker -lxml2
      - name: Verify the CLI is static
        if: github.event_name != 'pull_request'
        run: |
          .build/release/sempere --version
          ldd .build/release/sempere
          if ldd .build/release/sempere | grep -Eq 'libswift|libFoundation'; then echo "not static" >&2; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: success() && github.event_name != 'pull_request'
        with:
          name: sempere-linux-x86_64
          path: .build/release/sempere
          if-no-files-found: ignore

  macos:
    name: macOS
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          swift --version
      - name: Install age v1.3.2 (post-quantum interop)
        run: |
          curl -fsSL -o /tmp/age.tgz https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-darwin-arm64.tar.gz
          echo "e2020b073c44f692685a24d6abc378817eb81ffaaf49fd0531ef8565f767f2f5  /tmp/age.tgz" | shasum -a 256 -c -
          sudo tar xzf /tmp/age.tgz -C /usr/local/bin --strip-components=1 age/age age/age-keygen
          age --version
      # Build cache: main saves it, PRs only restore (docs/HANDOFF.md "CI").
      - id: cachekey
        name: Cache key (toolchain + resolved packages)
        run: echo "key=macos-$(echo "$GITHUB_WORKSPACE" | cksum | cut -d" " -f1)-$(swift --version 2>&1 | head -1 | cksum | cut -d' ' -f1)-${{ hashFiles('Package.resolved') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: .build
          key: ${{ steps.cachekey.outputs.key }}-${{ github.sha }}
          restore-keys: ${{ steps.cachekey.outputs.key }}-
      - name: Build
        run: swift build --build-tests
      - name: Test
        env:
          SEMPERE_REQUIRE_AGE_PQ: "1"
        run: swift test --skip-build --parallel
      - uses: actions/cache/save@v4
        if: success() && github.ref == 'refs/heads/main'
        with:
          path: .build
          key: ${{ steps.cachekey.outputs.key }}-${{ github.sha }}

  app:
    name: iPad and iPhone app (simulators + Mac Catalyst)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
          xcrun simctl list runtimes
      # Build cache: main saves it, PRs only restore (docs/HANDOFF.md "CI").
      - id: cachekey
        name: Cache key (toolchain + resolved packages)
        run: echo "key=app-$(echo "$GITHUB_WORKSPACE" | cksum | cut -d" " -f1)-$(xcodebuild -version 2>&1 | head -1 | cksum | cut -d' ' -f1)-${{ hashFiles('Package.resolved') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: .build/xcode
          key: ${{ steps.cachekey.outputs.key }}-${{ github.sha }}
          restore-keys: ${{ steps.cachekey.outputs.key }}-
      - name: Test on an iPad simulator
        run: scripts/app.sh test
      # The iPhone suites on an iPhone simulator: the build products are the iPad run's,
      # so this adds a boot and a few seconds of tests.
      - name: Test the iPhone layouts on an iPhone simulator
        run: scripts/app.sh test-phone
      # Same target and sources as the simulator build; checked on main only.
      - name: Build for Mac Catalyst (unsigned)
        if: github.event_name != 'pull_request'
        run: scripts/app.sh catalyst
      # The Mac suites and UI tests on Mac Catalyst (ad-hoc signed, sandboxed like the
      # shipped app): main and dispatch runs (`gh workflow run CI --ref <branch>`).
      - name: Test on Mac Catalyst
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        timeout-minutes: 45
        env:
          SEMPERE_MAC_TESTS: all
        run: scripts/app.sh test-mac
      - name: UI tests on Mac Catalyst
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        timeout-minutes: 20
        run: scripts/app.sh test-mac-ui
      - uses: actions/cache/save@v4
        if: success() && github.ref == 'refs/heads/main'
        with:
          path: .build/xcode
          key: ${{ steps.cachekey.outputs.key }}-${{ github.sha }}

  web:
    name: Web viewer (lint, typecheck, tests, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install (lockfile only)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests and cross-check against the committed Swift goldens
        run: npm test
      - name: Build (strict CSP)
        run: |
          npm run build
          grep -q 'Content-Security-Policy' dist/index.html

  web-golden:
    name: Web viewer goldens match the Swift CLI
    needs: changes
    if: needs.changes.outputs.webgolden == 'true'
    runs-on: ubuntu-24.04
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install zlib headers
        run: apt-get update -q && apt-get install -y -q zlib1g-dev
      # Restores the Linux job's cache from main (same key); never saves.
      - id: cachekey
        name: Cache key (toolchain + resolved packages)
        run: echo "key=linux-$(echo "$GITHUB_WORKSPACE" | cksum | cut -d" " -f1)-$(swift --version 2>&1 | head -1 | cksum | cut -d' ' -f1)-${{ hashFiles('Package.resolved') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: .build
          key: ${{ steps.cachekey.outputs.key }}-${{ github.sha }}
          restore-keys: ${{ steps.cachekey.outputs.key }}-
      - name: Build the CLI
        run: swift build --product sempere
      - name: Export the fixture vaults with the CLI and compare with web/test/golden
        run: |
          SEMPERE=.build/debug/sempere web/scripts/golden.sh /tmp/golden
          diff -r web/test/golden /tmp/golden

  # Manual only (`-f screenshots=true`): the App Store screenshots from a synthetic
  # demo vault. Nothing is uploaded to App Store Connect; download the artifact.
  screenshots:
    name: App Store screenshots
    if: github.event_name == 'workflow_dispatch' && inputs.screenshots
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
          xcrun simctl list runtimes
      - name: iPad (iPad Pro 13-inch simulator, 2064x2752)
        run: scripts/screenshots.sh ipad
      - name: iPhone (iPhone Pro Max simulator, 6.9")
        if: always()
        run: scripts/screenshots.sh iphone
      # Best effort: a Mac UI test needs automation permission on the runner.
      - name: Mac (Catalyst, 2880x1800)
        if: always()
        continue-on-error: true
        run: scripts/screenshots.sh mac
      - name: Summary of errors
        if: always()
        run: |
          for f in build/screenshots/*-summary.txt; do [ -f "$f" ] || continue; echo "== $f"; cut -c1-1500 "$f" | tail -40; done
          ls -l build/screenshots/ipad build/screenshots/iphone build/screenshots/mac 2>&1 | head -30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appstore-screenshots
          path: |
            build/screenshots/ipad/*.png
            build/screenshots/iphone/*.png
            build/screenshots/mac/*.png
            build/screenshots/mac-raw/*.png
            build/screenshots/*.log
            build/screenshots/*.xcresult
          if-no-files-found: warn
